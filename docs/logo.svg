<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 180" width="560" height="180" role="img" aria-label="EnhanciPy">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#00d65f"/>
      <stop offset="0.5" stop-color="#00a8f0"/>
      <stop offset="1" stop-color="#a43cff"/>
      <animate attributeName="x1" values="0;0.6;0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;1.6;1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="400" fill="url(#g)" filter="url(#glow)">
