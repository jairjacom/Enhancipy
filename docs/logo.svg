    <text x="20" y="62" textLength="520" lengthAdjust="spacing" xml:space="preserve">| __|_ _ | |_  __ _ _ _  __(_) _ \_  _  </text>
    <text x="20" y="90" textLength="520" lengthAdjust="spacing" xml:space="preserve">| _|| ' \| ' \/ _` | ' \/ _| |  _/ || | </text>
    <text x="20" y="118" textLength="520" lengthAdjust="spacing" xml:space="preserve">|___|_||_|_||_\__,_|_||_\__|_|_|  \_, | </text>
    <text x="20" y="146" textLength="520" lengthAdjust="spacing" xml:space="preserve">                                  |__/  </text>
  </g>
</svg>
